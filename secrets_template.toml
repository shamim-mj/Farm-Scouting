# ─────────────────────────────────────────────────────────────────
#  Farm Scout App – Streamlit Secrets Template
#  Save this as:  .streamlit/secrets.toml  (local)
#  OR paste each key into Streamlit Cloud → App Settings → Secrets
# ─────────────────────────────────────────────────────────────────

# ── CLOUDINARY (for photo storage) ────────────────────────────────
# Get from: cloudinary.com → Dashboard
CLOUDINARY_CLOUD_NAME = "your_cloud_name"
CLOUDINARY_API_KEY    = "your_api_key"
CLOUDINARY_API_SECRET = "your_api_secret"

# ── EMAIL (Gmail recommended) ─────────────────────────────────────
# Use a Gmail App Password (not your real password):
#   Google Account → Security → 2-Step Verification → App Passwords
EMAIL_SENDER   = "yourapp@gmail.com"
EMAIL_PASSWORD = "xxxx xxxx xxxx xxxx"   # 16-char App Password
EMAIL_RECEIVER = "shamim@uky.edu"         # Where alerts go (you)

# ── GOOGLE SHEETS (for record keeping) ────────────────────────────
# 1. Create a Google Sheet named "Farm Scout Issues"
# 2. Create a Service Account in Google Cloud Console
# 3. Share the Sheet with the service account email
# 4. Paste the entire JSON key file content below as one line
GSHEET_CREDENTIALS = '''
{
  "type": "service_account",
  "project_id": "your-project",
  "private_key_id": "...",
  "private_key": "-----BEGIN RSA PRIVATE KEY-----\n...\n-----END RSA PRIVATE KEY-----\n",
  "client_email": "farmscout@your-project.iam.gserviceaccount.com",
  "client_id": "...",
  "auth_uri": "https://accounts.google.com/o/oauth2/auth",
  "token_uri": "https://oauth2.googleapis.com/token"
}
'''

# Get from the Google Sheet URL:
# https://docs.google.com/spreadsheets/d/  >>>THIS PART<<<  /edit
GSHEET_ID = "your_google_sheet_id_here"

# ── FARM LIST ─────────────────────────────────────────────────────
